name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: gofmt · vet · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  integration:
    name: shellcheck · integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: src/go.sum
      - name: Install runtime deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap jq
      - name: Allow unprivileged user namespaces (bubblewrap)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: shellcheck
        run: shellcheck -S warning lib/*.sh packbox-install.sh packbox-packager.sh tests/*.sh
      - name: end-to-end (tests/integration.sh)
        run: bash tests/integration.sh
